x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW_CONN_MONGO_DEFAULT: mongodb://mongo:27017
    AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql://etl:etl@postgres-data:5432/ecommerce
    _PIP_ADDITIONAL_REQUIREMENTS: "pymongo apache-airflow-providers-mongo==4.1.1"
  volumes:
    - ./dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres-airflow:
      condition: service_healthy
  networks:
    - etl

services:
  postgres-airflow:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata_airflow:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    networks:
      - etl

  postgres-data:
    image: postgres:15
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
      POSTGRES_DB: ecommerce
    ports:
      - "5434:5432"
    volumes:
      - pgdata_ecommerce:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "etl", "-d", "ecommerce"]
      interval: 5s
      retries: 10
    networks:
      - etl

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - etl

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@local.com
      "
    restart: "no"
    depends_on:
      postgres-airflow:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  seed-mongo:
    image: python:3.11-slim
    volumes:
      - ./scripts:/scripts
    command: >
      bash -c "pip install pymongo --quiet && python /scripts/generate_data.py"
    depends_on:
      - mongo
    networks:
      - etl

volumes:
  pgdata_airflow:
  pgdata_ecommerce:
  mongodata:
  airflow_logs:

networks:
  etl:
    driver: bridge
